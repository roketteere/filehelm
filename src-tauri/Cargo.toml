[package]
name = "filehelm"
version = "0.2.2"
description = "filehelm — local project launcher + file commander"
authors = [
    "Joel Perez (@roketteere) <jxp489@gmail.com>",
    "Claude (Opus 4.7) <noreply@anthropic.com>",
]
repository = "https://github.com/roketteere/filehelm"
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.78"

[lib]
name = "filehelm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 shell + first-party plugins
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

# Single-instance guard — when a user re-launches FileHelm while one
# is already running, the second invocation surrenders to the first
# (which focuses + un-hides the window). Without this, two instances
# race for the OS-global hotkey and one loses.
tauri-plugin-single-instance = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# DB — sqlx (async) against SQLite. Runtime queries (no compile-time
# checks); avoids needing DATABASE_URL at build time.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "chrono",
] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Manifest parsing
toml = "0.8"

# README / Markdown parsing
pulldown-cmark = "0.12"
regex = "1"

# Filesystem walking
walkdir = "2"

# Time + ids
chrono = { version = "0.4", features = ["serde"] }

# Hashing for scan signatures
sha2 = "0.10"
hex = "0.4"

# Path expansion (~)
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
once_cell = "1"

# PTY runner (Phase 2.5) — wraps Windows ConPTY / *nix openpty.
portable-pty = "0.8"

# File commander archive support (Phase 3.1).
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
